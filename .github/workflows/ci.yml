name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source (typecheck, lint, format)
        run: bun run typecheck && bun run lint && bun run format:check

      - name: Validate generated procedural inventory and archive isolation
        run: bun run assets:validate

      - name: Validate original-mall compatibility when present
        run: bun run assets:validate:compatibility

      - name: Validate GLB-free mall coverage and rendering batches
        run: bun run assets:validate:mall && bun run assets:report:mall

      - name: Build production bundle
        run: bun run build

      - name: Check production chunks
        run: bun scripts/assets/check-build-chunks.ts

      - name: Upload generated asset metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-asset-metrics
          path: reports/assets/*.json
          if-no-files-found: ignore
