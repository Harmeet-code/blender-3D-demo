name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck, lint, format, tests)
        run: bun run verify

      - name: Validate production assets
        run: bun run assets:validate

      - name: Build production bundle
        run: bun run build

      - name: Check production chunks
        run: bun scripts/assets/check-build-chunks.ts
