name: spatial-venue-3d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spatial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spatial-dev}
      POSTGRES_DB: ${POSTGRES_DB:-spatial}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-spatial} -d $${POSTGRES_DB:-spatial}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgres://${POSTGRES_USER:-spatial}:${POSTGRES_PASSWORD:-spatial-dev}@postgres:5432/${POSTGRES_DB:-spatial}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${SERVER_PORT:-8000}:8000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  redisdata:
