# A temporary missing deploy artifact must never become a cached error.
map $status $r3f_asset_cache_control {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm;

  # Built bundle lives at /usr/share/nginx/html/floorplan (Vite base '/floorplan/').
  location /floorplan/ {
    alias /usr/share/nginx/html/floorplan/;
    try_files $uri $uri/ /floorplan/index.html;
    # Entry HTML revalidates so a deploy publishes fresh JS and asset fingerprints.
    # Content-addressed resources can be retained; plain mutable URLs revalidate.
    add_header Cache-Control "no-cache";
  }

  location ~ "^/floorplan/assets/.*-[a-zA-Z0-9_-]{8,}\.[a-zA-Z0-9]+$" {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control $r3f_asset_cache_control always;
  }

  location ~ "^/floorplan/asset-cache/[a-f0-9]{64}\.(glb|webp|png|jpe?g)$" {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control $r3f_asset_cache_control always;
  }

  # API + presence socket proxy to the Fastify server (compose service `server`).
  location ~ "^/floorplan/mall-assets/procedural-scene\.[a-f0-9]{20}\.json\.gz$" {
    root /usr/share/nginx/html;
    try_files $uri =404;
    default_type application/gzip;
    add_header Cache-Control $r3f_asset_cache_control always;
  }

  location /api/ {
    proxy_pass http://server:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /ws/ {
    proxy_pass http://server:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

